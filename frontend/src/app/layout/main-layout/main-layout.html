<!-- Khung chính: header cố định + sidebar theo quyền + vùng nội dung lazy-loaded -->
<div class="min-h-dvh bg-slate-100">
  <header
    class="sticky top-0 z-30 flex items-center justify-between gap-3 border-b border-slate-200 bg-white px-4"
    style="height: var(--sh-header-height)"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="rounded-md border border-slate-300 px-2 py-1 text-sm lg:hidden"
        aria-label="Mở/đóng menu"
        (click)="toggleSidebar()"
      >
        ☰
      </button>

      <a routerLink="/dashboard" class="flex items-center gap-2">
        <span
          class="grid h-8 w-8 place-items-center rounded-md bg-brand-600 text-sm font-bold text-white"
          >ACE</span
        >
        <span class="hidden text-sm font-semibold text-slate-800 sm:block">
          Apex Circuit Electronics
        </span>
      </a>
    </div>

    <div class="flex items-center gap-2">
      @if (loading.isBusy()) {
        <span class="hidden text-xs text-slate-400 sm:inline">Đang xử lý…</span>
      }

      @if (isAuthenticated()) {
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium text-slate-800">{{ displayName() }}</p>
          @if (roleText()) {
            <p class="text-[11px] text-slate-500">{{ roleText() }}</p>
          }
        </div>
        <button
          type="button"
          class="rounded-md border border-slate-300 px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-50"
          (click)="logout()"
        >
          Đăng xuất
        </button>
      } @else {
        <a
          routerLink="/login"
          class="rounded-md bg-brand-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-brand-700"
        >
          Đăng nhập
        </a>
      }
    </div>
  </header>

  <div class="flex">
    <!--
      Sidebar: ẩn trên mobile (mở bằng nút ☰), luôn hiện từ lg trở lên.
      `[class]` chỉ điều khiển trạng thái mobile; `lg:translate-x-0` trong class tĩnh thắng ở breakpoint lg
      (utility có variant responsive được Tailwind sinh sau utility không variant).
    -->
    <aside
      class="fixed inset-y-0 left-0 z-20 w-[var(--sh-sidebar-width)] border-r border-slate-200 bg-white pt-3 transition-transform lg:sticky lg:top-[var(--sh-header-height)] lg:h-[calc(100vh-var(--sh-header-height))] lg:translate-x-0"
      [class]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'"
    >
      <nav class="flex flex-col gap-1 px-2">
        @for (item of navItems(); track item.route) {
          <a
            class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
            routerLinkActive="bg-brand-50 font-semibold text-brand-700"
            [routerLink]="item.route"
            (click)="closeSidebar()"
          >
            <span aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>

    @if (sidebarOpen()) {
      <div class="fixed inset-0 z-10 bg-slate-900/20 lg:hidden" (click)="closeSidebar()"></div>
    }

    <main class="min-w-0 flex-1 p-4">
      <router-outlet />
    </main>
  </div>
</div>
